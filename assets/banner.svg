<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="auto">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glowCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glowPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.4" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .bg { fill: url(#bgGrad); }
    .grid-layer { fill: url(#grid); }
    
    /* Background Dynamic Floating Orbs */
    .orb-1 {
      animation: floatOrb1 14s ease-in-out infinite alternate;
    }
    .orb-2 {
      animation: floatOrb2 16s ease-in-out infinite alternate;
    }
    .pulse-glow {
      animation: pulseGlow 6s ease-in-out infinite alternate;
    }
    
    /* Dynamic Workflow Stream lines in background */
    .flow-line {
      stroke-dasharray: 8, 8;
      animation: flowStream 25s linear infinite;
    }
    .flow-node {
      animation: nodePulse 3s ease-in-out infinite alternate;
    }

    @keyframes floatOrb1 {
      0% { transform: translate(0px, 0px) scale(1); }
      100% { transform: translate(70px, 40px) scale(1.15); }
    }
    @keyframes floatOrb2 {
      0% { transform: translate(0px, 0px) scale(1); }
      100% { transform: translate(-80px, -30px) scale(1.2); }
    }
    @keyframes pulseGlow {
      0% { opacity: 0.35; }
      100% { opacity: 0.75; }
    }
    @keyframes flowStream {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes nodePulse {
      0% { r: 4; opacity: 0.5; }
      100% { r: 6.5; opacity: 1; }
    }

    .main-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 46px;
      font-weight: 800;
      letter-spacing: -0.5px;
      fill: #ffffff;
    }
    .main-subtitle {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 20px;
      font-weight: 500;
      fill: #94a3b8;
    }
    .tagline {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      fill: #38bdf8;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 13px;
      font-weight: 600;
      fill: #e2e8f0;
    }
  </style>

  <!-- 1. Background Base -->
  <rect width="1200" height="420" rx="16" class="bg" />
  <rect width="1200" height="420" rx="16" class="grid-layer" />

  <!-- 2. Dynamic Animated Background Elements (Always strictly behind foreground text) -->
  <g class="orb-1">
    <circle cx="200" cy="120" r="180" fill="url(#glowCyan)" filter="url(#softGlow)" />
  </g>
  <g class="orb-2">
    <circle cx="1020" cy="300" r="220" fill="url(#glowPurple)" filter="url(#softGlow)" />
  </g>

  <!-- Subtle Dynamic Pipeline Flow (Background visual metaphor for automated document generation) -->
  <g opacity="0.35">
    <path class="flow-line" d="M 80 340 C 300 370, 450 310, 680 350 S 950 320, 1120 340" fill="none" stroke="#6366f1" stroke-width="2.5" />
    <path class="flow-line" d="M 120 80 C 350 40, 550 110, 800 60 S 1000 100, 1100 70" fill="none" stroke="#0ea5e9" stroke-width="2" />
    <circle class="flow-node" cx="300" cy="350" fill="#38bdf8" />
    <circle class="flow-node" cx="680" cy="350" fill="#818cf8" />
    <circle class="flow-node" cx="950" cy="330" fill="#c084fc" />
    <circle class="flow-node" cx="350" cy="55" fill="#38bdf8" />
    <circle class="flow-node" cx="800" cy="60" fill="#c084fc" />
  </g>

  <!-- Decorative Border Frame -->
  <rect x="2" y="2" width="1196" height="416" rx="15" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- 3. Foreground Header Content (Clean, legible, and unhidden) -->
  <g transform="translate(600, 75)" text-anchor="middle">
    <!-- Category Pill / Tagline -->
    <rect x="-180" y="0" width="360" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5" />
    <text x="0" y="21" text-anchor="middle" class="tagline">⚡ Automated Document Publishing</text>

    <!-- Main Title -->
    <text x="0" y="82" class="main-title">
      Awesome <tspan fill="url(#primaryGrad)">Document Publishing</tspan>
    </text>

    <!-- Subtitle -->
    <text x="0" y="122" class="main-subtitle">
      Curated Landscape of Enterprise SaaS Engines &amp; High-Performance Open-Source Pipelines
    </text>
  </g>

  <!-- 4. Interactive Architecture Metaphor Pills (Foreground) -->
  <g transform="translate(180, 255)">
    <!-- Pill 1: Data-Driven -->
    <g transform="translate(0, 0)">
      <rect width="180" height="42" rx="21" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6" />
      <text x="90" y="26" text-anchor="middle" class="pill-text">📊 Data-Driven Layout</text>
    </g>

    <!-- Connector 1 -->
    <line x1="185" y1="21" x2="215" y2="21" stroke="#64748b" stroke-width="2" stroke-dasharray="4,4" />

    <!-- Pill 2: Headless Composition -->
    <g transform="translate(220, 0)">
      <rect width="190" height="42" rx="21" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.6" />
      <text x="95" y="26" text-anchor="middle" class="pill-text">⚙️ Headless Engines</text>
    </g>

    <!-- Connector 2 -->
    <line x1="415" y1="21" x2="445" y2="21" stroke="#64748b" stroke-width="2" stroke-dasharray="4,4" />

    <!-- Pill 3: Omnichannel Publishing -->
    <g transform="translate(450, 0)">
      <rect width="190" height="42" rx="21" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="1.2" stroke-opacity="0.6" />
      <text x="95" y="26" text-anchor="middle" class="pill-text">🚀 Omnichannel Output</text>
    </g>

    <!-- Connector 3 -->
    <line x1="645" y1="21" x2="675" y2="21" stroke="#64748b" stroke-width="2" stroke-dasharray="4,4" />

    <!-- Pill 4: Agentic & MCP -->
    <g transform="translate(680, 0)">
      <rect width="160" height="42" rx="21" fill="url(#cardGrad)" stroke="#ec4899" stroke-width="1.2" stroke-opacity="0.6" />
      <text x="80" y="26" text-anchor="middle" class="pill-text">🤖 AI &amp; MCP Ready</text>
    </g>
  </g>

  <!-- 5. Bottom Metadata Line -->
  <g transform="translate(600, 365)" text-anchor="middle">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#64748b">
      Catalogs • Magazines • Technical Documentation • Single-Source Multi-Format • Automated Typography
    </text>
  </g>
</svg>
