<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="auto" viewBox="0 0 1200 420"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#090d16"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#1e1b4b"/></linearGradient><linearGradient id="primaryGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="glowCyan" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#06b6d4" stop-opacity=".3"/><stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/></linearGradient><linearGradient id="glowPurple" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#a855f7" stop-opacity=".35"/><stop offset="100%" stop-color="#a855f7" stop-opacity="0"/></linearGradient><linearGradient id="cardGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1e293b" stop-opacity=".8"/><stop offset="100%" stop-color="#0f172a" stop-opacity=".8"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#334155" stroke-opacity=".4" stroke-width=".75" d="M 40 0 L 0 0 0 40"/></pattern><filter id="softGlow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="6"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes floatOrb1{0%{transform:translate(0,0) scale(1)}}@keyframes floatOrb2{0%{transform:translate(0,0) scale(1)}}@keyframes pulseGlow{0%{opacity:.35}}@keyframes flowStream{0%{stroke-dashoffset:200}}@keyframes nodePulse{0%{r:4;opacity:.5}}.bg{fill:url(#bgGrad)}.grid-layer{fill:url(#grid)}.orb-1{animation:floatOrb1 14s ease-in-out infinite alternate}.orb-2{animation:floatOrb2 16s ease-in-out infinite alternate}.flow-line{stroke-dasharray:8,8;animation:flowStream 25s linear infinite}.flow-node{animation:nodePulse 3s ease-in-out infinite alternate}.main-title{font-size:46px;font-weight:800;letter-spacing:-.5px;fill:#fff}.main-subtitle,.main-title,.pill-text,.tagline{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif}.main-subtitle{font-size:20px;font-weight:500;fill:#94a3b8}.pill-text,.tagline{font-weight:600}.tagline{font-size:15px;letter-spacing:1.5px;text-transform:uppercase;fill:#38bdf8}.pill-text{font-size:13px;fill:#e2e8f0}</style><rect width="1200" height="420" class="bg" rx="16"/><rect width="1200" height="420" class="grid-layer" rx="16"/><g class="orb-1"><circle cx="200" cy="120" r="180" fill="url(#glowCyan)" filter="url(#softGlow)"/></g><g class="orb-2"><circle cx="1020" cy="300" r="220" fill="url(#glowPurple)" filter="url(#softGlow)"/></g><g opacity=".35"><path fill="none" stroke="#6366f1" stroke-width="2.5" d="M 80 340 C 300 370, 450 310, 680 350 S 950 320, 1120 340" class="flow-line"/><path fill="none" stroke="#0ea5e9" stroke-width="2" d="M 120 80 C 350 40, 550 110, 800 60 S 1000 100, 1100 70" class="flow-line"/><circle cx="300" cy="350" fill="#38bdf8" class="flow-node"/><circle cx="680" cy="350" fill="#818cf8" class="flow-node"/><circle cx="950" cy="330" fill="#c084fc" class="flow-node"/><circle cx="350" cy="55" fill="#38bdf8" class="flow-node"/><circle cx="800" cy="60" fill="#c084fc" class="flow-node"/></g><rect width="1196" height="416" x="2" y="2" fill="none" stroke="#334155" stroke-opacity=".6" stroke-width="1.5" rx="15"/><g text-anchor="middle" transform="translate(600, 75)"><rect width="360" height="32" x="-180" y="0" fill="#1e293b" stroke="#38bdf8" stroke-opacity=".5" stroke-width="1" rx="16"/><text x="0" y="21" class="tagline" text-anchor="middle">⚡ Automated Document Publishing</text><text x="0" y="82" class="main-title">Awesome <tspan fill="url(#primaryGrad)">Document Publishing</tspan></text><text x="0" y="122" class="main-subtitle">Curated Landscape of Enterprise SaaS Engines 